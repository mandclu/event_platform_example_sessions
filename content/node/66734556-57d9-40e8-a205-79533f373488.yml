  field_description:
    -
      value: "<p>Often when embarking on a new technology project, your first attempt feels good when you deliver it, but you look at it later and think, that could have been done better. Sometimes, that means it ends up being rebuilt from scratch.</p><p>It helps to know what resources you can pull together to get started--to get off on the right foot. This session is perfect for those who have been through a Drupal In-One-Day training or other beginner trainings and are looking to <em>begin</em> their journey to a production deployed Drupal website.</p><p>Whether spinning up your first or wanting to do it better next, this session should help you lay the ground work for a more successful Drupal project launch in your near future.&nbsp;<br><br>We'll go over&nbsp;</p><ul><li>project initiation concerns, </li><li>local and remote development environment options,</li><li>available production hosting resources, </li><li>content structure theory, and </li><li>theme selection considerations.</li></ul><p>We'll also introduce resources for non-developers who want to realize their project without custom theming and development. My hope is, you launch a nice looking, functional, and productive CMS to production when you apply the opinions and follow the steps laid out in this session.</p>"
