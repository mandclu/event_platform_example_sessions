  field_description:
    -
      value: "<p>One of the key elements of the Starshot Initiative is the rapidly evolving system for Recipes. Designed to accelerate site-building, recipes will help people new to Drupal to solve for common needs, and for users of all skill levels to quickly build out content architectures using best practices.</p><p>This talk will discuss the elements that make up a recipe, how to use recipes, and what new capabilities are still in development. We'll also do a deep dive into the Events recipe and its available add-ons, allowing you meet even complex requirements quickly and without custom code.</p>"
