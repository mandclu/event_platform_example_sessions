  field_description:
    -
      value: "<p>You've built sites with Drupal and know that with a few dozen modules (and a ton of configuring), you can do nearly everything in modern Drupal. &nbsp;\"There's a module for that\" is one the sweetest sounds you can hear.</p><p>But what do you do when there's not a module for that? &nbsp;When the modules that exist don't meet your needs, and cannot be made to by contributing changes?</p><p>You make your own.</p><p>This session will help you take that step. &nbsp;All you need to do is write two text files. The first file tells Drupal about the module; it’s not code. The second file can have as little as three lines of code in it. &nbsp;Making a module is something that anyone can do. There are many (mostly simple) rules to follow and tons of tools to use— and lots of exploration to do. Every person developing a module is still learning.</p>"
