  field_description:
    -
      value: "<p>Did you know that around 1 in 68 people are diagnosed with an autism spectrum disorder? People with autism and Asperger's are becoming a growing part of civilization, and a growing part of the tech workforce, yet in spite of their high intelligence and remarkable creativity and passion, they often go unemployed and underemployed within our society.</p><p>This presentation will attempt to debunk myths around autism and present autistic strengths and challenges, while also sharing why we believe it is important for Drupal firms and other employers to start considering accommodating potential employees with autism spectrum disorders.</p><p>The presentation will cover the following topics/issues:</p><ol><li>Debunking the Myths surrounding the Autism diagnosis, which would include providing information about this diagnosis and how it might present in the workplace or in general, which would include providing statistics as to the percentage of autistic individuals who are in the tech field and what tech employers, including Microsoft, are offering them.</li><li>Covering the challenges and strengths of an individual on the spectrum and how his or her participation in the tech workforce could be a very good fit for this individual and the tech employer.</li><li>How does the Americans with Disabilities Act (ADA) impact the tech employer when it is considering employing an individual who is on the Autism Spectrum.</li></ol><p>What are some examples of reasonable accommodations that an employer should legally offer an employee or potential employee with autism under the ADA?</p><p>What are potential modifications to the workplace that the individual with autism wants an employer to offer even if the employer is not legally required to do so under the ADA.</p>"
