  field_description:
    -
      value: "<p>Integration of artificial intelligence functionality with Drupal has been on a blistering pace over the past year. From countless individual contributed modules taking initial tentative steps to the rapidly-becoming-a-best-practice AI module ecosystem, the Drupal community has largely embraced the possibilities of leveraging AI on user, site-builder, and developer levels.</p><p>This presentation will provide an overview of where we are, where we've been, and where we're heading with a focus on the AI module ecosystem as well as AI integration with Drupal CMS. Several live demos will showcase existing functionality that you can add to your Drupal sites today.</p>"
