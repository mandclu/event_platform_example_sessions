  field_description:
    -
      value: "<p>For the past few years, an internal revolution has been brewing in Drupal. The more I see of how our initiatives are evolving the more I'm convinced that the way we build Drupal sites are about to fundamentally change. &nbsp;Let's make the case for:</p><ul><li>How new solutions emerging in Drupal invite you to rethink how to build sites</li><li>What you are your team can do to get the most out of these new tools</li><li>The benefits for clients if you do</li></ul><p>In my day job, I provide long term support for Drupal sites built many different ways. &nbsp;I support sites built with Acquia Site Studio, Layout Builder, Paragraphs and a couple of unique builds. &nbsp;I'm seeing a convergence of ideas on how best to build these sites. &nbsp;Let me share with you a strategy for getting your sites ready for the future.</p>"
