  field_description:
    -
      value: "<p>In this session, discover how we partnered with the Milken Institute, a global think tank, to transform their Drupal website, improving UX, taxonomy, and delivering highly valuable research to the users who need it most - and fast.&nbsp;<br><br>Learn how user research drove decisions about content priority, cross-linking, categorizing, and hierarchy, and how we used what Drupal does best to power a site that delivers time-sensitive and highly sought-after event recordings and research for end users. We'll also review what we heard from content administrators and how we improved their experience to meet their needs of frequent updates and tight deadlines.<br><br>Key takeaways include best practices for managing complex Drupal architectures, the importance of user research, and lessons learned in refining taxonomy and empowering in-house teams. Whether you're facing similar challenges or want to deepen your Drupal expertise, this session offers practical insights into balancing design, technology, and content strategy.</p>"
