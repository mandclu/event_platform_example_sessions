  field_description:
    -
      value: "<p>There's usually at least three different ways to do a thing in software development.</p><p>When it comes to importing content, making batches of updates, and other operations, Drupal's core queue operations take a backseat to migrations, feeds, and manual content entry, among other solutions. Once you get the hang of queues, though, you may tell migration YAMLs to get lost!</p><p>We'll look at what the heck Drupal is doing back there, some of the wild things you can pull off with a queue worker, some times when it's not the right tool for the job, and walk away with some easy-to-adapt sample code for your next project.</p>"
