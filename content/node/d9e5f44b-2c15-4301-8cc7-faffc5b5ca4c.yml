      value: '<p>Ever wanted a Drupal module to delight or impress you in ways you hadn’t expected? There’s a module-expert for that: It’s <strong>Martin Anderson-Clutz</strong>, co-host of the <a href="https://talkingdrupal.com/">Talking Drupal podcast</a>.</p><p>This talk will highlight a range of modules that will have your sites performing in new, clever, efficient and/or delightful ways.</p><p>There''s something for you if you’re a developer, site builder, Drupal enthusiast, a content editor, a web developer looking to expand your skill set and uncover Drupal''s possibilities, or want to meet other similarly intrigued people.</p>'
